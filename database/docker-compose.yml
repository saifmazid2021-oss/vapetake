services:
  postgres:
    image: postgres:16-alpine
    container_name: vapospy_clone_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: vapospy
      POSTGRES_PASSWORD: vapospy
      POSTGRES_DB: vapospy_clone
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
